# Local testing: runs the site against a local copy of the sheet, and catches all email in Mailpit.
# Nothing here writes to the real Google Sheet or sends real email.
#
#   docker compose -f docker-compose.local.yml run --rm tools sh -c "npm ci && node scripts/make-local-sheet.js"
#   docker compose -f docker-compose.local.yml up --build
#
# Site: http://localhost:3000   Test inbox: http://localhost:8025
services:
  app:
    build: .
    ports:
      - "3000:3800"
    volumes:
      - ./.local-data:/app/.local-data
    environment:
      # Values here override .env.local
      LOCAL_SHEET_FILE: /app/.local-data/sheet.json
      EMAIL_HOST: mailpit
      EMAIL_PORT: "1025"
      EMAIL_USER: hello@firstmentor.local
      EMAIL_PASSWORD: local-test
      MAILPIT_API_URL: http://mailpit:8025
      APP_BASE_URL: http://localhost:3000
      JWT_SECRET: local-development-secret-not-used-in-production
    depends_on:
      - mailpit

  # One-off helper for scripts (e.g. making the local sheet copy)
  tools:
    image: node:20-alpine
    working_dir: /app
    profiles: ["tools"]
    volumes:
      - .:/app
      - node_modules:/app/node_modules

  mailpit:
    image: axllent/mailpit:v1.20
    ports:
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"

volumes:
  node_modules:
