# Local testing: runs the site against a local copy of the sheet, and catches all email in Mailpit.
# Nothing here writes to the real Google Sheet or sends real email.
#
#   docker compose -f docker-compose.local.yml run --rm app sh -c "npm ci && node scripts/make-local-sheet.js"
#   docker compose -f docker-compose.local.yml up
#
# Site: http://localhost:3000   Test inbox: http://localhost:8025
services:
  app:
    image: node:18-alpine
    working_dir: /app
    command: sh -c "npm ci --no-audit --no-fund && npm run dev"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    environment:
      # Values here override .env.local
      LOCAL_SHEET_FILE: /app/.local-data/sheet.json
      EMAIL_HOST: mailpit
      EMAIL_PORT: "1025"
      EMAIL_USER: hello@firstmentor.local
      EMAIL_PASSWORD: local-test
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
      JWT_SECRET: local-development-secret-not-used-in-production
      WATCHPACK_POLLING: "true"
    depends_on:
      - mailpit

  mailpit:
    image: axllent/mailpit:v1.20
    ports:
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"

volumes:
  node_modules:
  next_cache:
